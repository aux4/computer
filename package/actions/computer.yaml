context: computer
actions:
  # Every action below calls the front door "aux4 computer <verb>" (never a
  # provider binary directly), so the shared stop switch and action log
  # always apply. The block-level app ("on context computer with app
  # \"X\"") is the default target via the {{app}} context variable; a
  # per-step "in {app}" override wins for that line only, via the ${app}
  # pattern variable. aux4/computer treats --app "" the same as omitting
  # --app (frontmost app / whole screen), so {{app}} can always be embedded.
  # All variables are single-quoted in the shell command so app/element
  # names with spaces survive.

  - expression: "open {app}"
    execute: "aux4 computer open --app '${app}'"

  - expression: "focus {app}"
    execute: "aux4 computer focus --app '${app}'"

  - expression: "quit {app}"
    execute: "aux4 computer quit --app '${app}'"

  - expression: "state in {app}"
    execute: "aux4 computer state --app '${app}'"

  - expression: "state"
    execute: "aux4 computer state --app '{{app}}'"

  - expression: "find {text} in {app}"
    execute: "aux4 computer find --text '${text}' --app '${app}'"

  - expression: "find {text}"
    execute: "aux4 computer find --text '${text}' --app '{{app}}'"

  - expression: "wait for {text} in {app}"
    execute: "aux4 computer wait --text '${text}' --app '${app}'"

  - expression: "wait for {text}"
    execute: "aux4 computer wait --text '${text}' --app '{{app}}'"

  # "click on {name}" resolves the label to coordinates via "find" (read-only)
  # and clicks through the front door; no --name flag exists on "click".
  # "click --app" takes WINDOW-relative coordinates (find's windowCenter);
  # without an app, coordinates are screen-absolute (find's center) -- jq
  # picks the matching field based on whether an app is set for this line.
  - expression: "click on {name} in {app}"
    execute: "X=$(aux4 computer find --text '${name}' --app '${app}' | jq -r --arg app '${app}' 'if ($app|length)>0 then ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].windowCenter.x // empty) else ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].center.x // empty) end') && Y=$(aux4 computer find --text '${name}' --app '${app}' | jq -r --arg app '${app}' 'if ($app|length)>0 then ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].windowCenter.y // empty) else ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].center.y // empty) end') && if [ -z "$X" ]; then echo 'No element matching "${name}" found' >&2; exit 1; fi && aux4 computer click --x $X --y $Y --app '${app}'"

  - expression: "click on {name}"
    execute: "X=$(aux4 computer find --text '${name}' --app '{{app}}' | jq -r --arg app '{{app}}' 'if ($app|length)>0 then ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].windowCenter.x // empty) else ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].center.x // empty) end') && Y=$(aux4 computer find --text '${name}' --app '{{app}}' | jq -r --arg app '{{app}}' 'if ($app|length)>0 then ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].windowCenter.y // empty) else ((.matches | map(select(.frame.width>0 and .frame.height>0)))[0].center.y // empty) end') && if [ -z "$X" ]; then echo 'No element matching "${name}" found' >&2; exit 1; fi && aux4 computer click --x $X --y $Y --app '{{app}}'"

  - expression: "click at {x} {y} in {app}"
    execute: "aux4 computer click --x ${x} --y ${y} --app '${app}'"
    params:
      x: -?\d+
      y: -?\d+

  - expression: "click at {x} {y}"
    execute: "aux4 computer click --x ${x} --y ${y} --app '{{app}}'"
    params:
      x: -?\d+
      y: -?\d+

  - expression: "type {text} in {app}"
    execute: "aux4 computer type --text '${text}' --app '${app}'"

  - expression: "type {text}"
    execute: "aux4 computer type --text '${text}' --app '{{app}}'"

  - expression: "shortcut {keys} in {app}"
    execute: "aux4 computer shortcut --keys '${keys}' --app '${app}'"

  - expression: "shortcut {keys}"
    execute: "aux4 computer shortcut --keys '${keys}' --app '{{app}}'"

  - expression: "press {keys} in {app}"
    execute: "aux4 computer shortcut --keys '${keys}' --app '${app}'"

  - expression: "press {keys}"
    execute: "aux4 computer shortcut --keys '${keys}' --app '{{app}}'"

  - expression: "scroll down {amount} in {app}"
    execute: "aux4 computer scroll --dy ${amount} --app '${app}'"
    params:
      amount: \d+

  - expression: "scroll down {amount}"
    execute: "aux4 computer scroll --dy ${amount} --app '{{app}}'"
    params:
      amount: \d+

  - expression: "scroll up {amount} in {app}"
    execute: "aux4 computer scroll --dy -${amount} --app '${app}'"
    params:
      amount: \d+

  - expression: "scroll up {amount}"
    execute: "aux4 computer scroll --dy -${amount} --app '{{app}}'"
    params:
      amount: \d+

  - expression: "drag from {x} {y} to {toX} {toY}"
    execute: "aux4 computer drag --x ${x} --y ${y} --toX ${toX} --toY ${toY}"
    params:
      x: -?\d+
      y: -?\d+
      toX: -?\d+
      toY: -?\d+

  - expression: "menu {path} in {app}"
    execute: "aux4 computer menu --path '${path}' --app '${app}'"

  - expression: "menu {path}"
    execute: "aux4 computer menu --path '${path}' --app '{{app}}'"

  - expression: "press {button} dialog button in {app}"
    execute: "aux4 computer dialog --press '${button}' --app '${app}'"

  - expression: "press {button} dialog button"
    execute: "aux4 computer dialog --press '${button}' --app '{{app}}'"

  - expression: "dialog in {app}"
    execute: "aux4 computer dialog --app '${app}'"

  - expression: "dialog"
    execute: "aux4 computer dialog --app '{{app}}'"

  - expression: "screenshot {output} in {app}"
    execute: "aux4 computer screenshot --output '${output}' --app '${app}'"

  - expression: "screenshot {output}"
    execute: "aux4 computer screenshot --output '${output}' --app '{{app}}'"

  - expression: "screenshot in {app}"
    execute: "aux4 computer screenshot --app '${app}'"

  - expression: "screenshot"
    execute: "aux4 computer screenshot --app '{{app}}'"

  - expression: "ocr {text} in {app}"
    execute: "aux4 computer ocr --text '${text}' --app '${app}'"

  - expression: "ocr {text}"
    execute: "aux4 computer ocr --text '${text}' --app '{{app}}'"

  - expression: "ocr in {app}"
    execute: "aux4 computer ocr --app '${app}'"

  - expression: "ocr"
    execute: "aux4 computer ocr --app '{{app}}'"

  - expression: "clipboard copy in {app}"
    execute: "aux4 computer clipboard copy --app '${app}'"

  - expression: "clipboard copy"
    execute: "aux4 computer clipboard copy --app '{{app}}'"

  - expression: "clipboard paste {text} in {app}"
    execute: "aux4 computer clipboard paste --text '${text}' --app '${app}'"

  - expression: "clipboard paste {text}"
    execute: "aux4 computer clipboard paste --text '${text}' --app '{{app}}'"

  - expression: "clipboard read"
    execute: "aux4 computer clipboard read"
